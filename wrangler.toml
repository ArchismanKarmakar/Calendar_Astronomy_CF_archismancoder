# Cloudflare Workers project (static site + two small API routes).
# Deploy command: npx wrangler deploy      (Workers & Pages -> Create -> Import a repository)
name = "calendar-astronomy-cf-archismancoder"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Served only on your own domain, so the zone's WAF rules (country blocks etc.) always apply.
# The *.workers.dev address and per-version preview URLs skip those rules, so they are off.
routes = [{ pattern = "calendar.archismancoder.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "./site"
binding = "ASSETS"
# Only /api/* runs the Worker; every other request is served straight from the static files.
run_worker_first = ["/api/*"]

[vars]
# Set to "1" only if another site of yours must use the image proxy.
ALLOW_ANY_ORIGIN = "0"
# Two-letter country codes refused by the API routes too (a second line of defence behind
# the zone's WAF rule). Keep it in step with the WAF rule; empty = no block.
BLOCKED_COUNTRIES = "PK,TR,CN,BD,AZ,KP"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
